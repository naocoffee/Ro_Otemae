<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>炉点前 稽古帖｜裏千家 炉のお点前 手順確認クイズ</title>
  <meta name="description" content="裏千家茶道・炉のお点前の手順と道具の配置を、上から見た配置図を見ながら四択で確認できる稽古用クイズです。">
  <meta name="theme-color" content="#27312a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="site-head">
    <div class="head-inner">
      <h1 class="head-title">炉点前 稽古帖</h1>
      <p class="head-lead">裏千家・炉のお点前。お点前を選び、道具の配置図を見ながら「次の所作」を答えましょう。</p>
    </div>
  </header>

  <nav class="temae-nav" aria-label="お点前の選択">
    <div class="tabs" id="tabs" role="tablist"></div>
  </nav>

  <main class="wrap">
    <section class="intro">
      <div class="intro-text">
        <p class="intro-group" id="temaeGroup"></p>
        <h2 class="intro-title" id="temaeTitle"></h2>
        <p class="intro-lead" id="temaeLead"></p>
      </div>
      <div class="controls">
        <div class="mode" role="group" aria-label="表示の切り替え">
          <button type="button" class="mode-btn is-active" data-mode="quiz" aria-pressed="true">クイズ</button>
          <button type="button" class="mode-btn" data-mode="steps" aria-pressed="false">手順を確認</button>
        </div>
        <div class="mode guide" role="group" aria-label="配置図のガイド表示">
          <span class="guide-label">図のガイド</span>
          <button type="button" class="mode-btn guide-btn is-active" data-guide="on" aria-pressed="true">あり</button>
          <button type="button" class="mode-btn guide-btn" data-guide="off" aria-pressed="false">なし</button>
        </div>
      </div>
    </section>

    <div class="stage">
      <figure class="board">
        <div class="board-frame">
          <div class="board-svg" id="diagram"></div>
        </div>
        <figcaption class="board-cap" id="diagramCaption"></figcaption>
      </figure>

      <section class="panel" id="panel" aria-live="polite"></section>
    </div>

    <p class="note">
      手順と配置図は、代表的な流れを稽古用に簡略化したものです。道具の位置や細かな所作は、道具組・お席・社中によって異なることがあります。実際のお稽古では先生のご指導を優先してください。
    </p>
  </main>

  <footer class="site-foot">
    <p>炉点前 稽古帖 ─ 稽古の復習用</p>
  </footer>

  <script src="script.js?v=6"></script>
</body>
</html>
